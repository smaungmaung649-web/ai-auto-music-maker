
<!DOCTYPE html>
<html lang="my">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Auto Music Maker</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#101323;color:white;font-family:Arial,sans-serif;text-align:center;padding:24px 16px}
h1{color:#55e6c1;font-size:27px}
p{color:#c4c8d8}
.panel{background:#1d2338;padding:22px;border-radius:18px;margin-top:25px}
button{border:0;border-radius:12px;padding:15px 22px;margin:7px;font-size:16px;font-weight:bold;background:#55e6c1;color:#101323}
button:disabled{opacity:.4}
#status{margin:18px;color:#55e6c1}
audio{width:100%;margin-top:18px}
.small{font-size:13px;color:#9ca5bb}
</style>
</head>
<body>
<h1>🎵 AI AUTO MUSIC MAKER</h1>
<p>သီဆိုပါ။ ကိုယ့်သီချင်းကို ဖန်တီးပါ။</p>

<div class="panel">
<h2>🎙️ အသံသွင်းရန်</h2>
<button id="record">အသံစသွင်းမယ်</button>
<button id="stop" disabled>ရပ်မယ်</button>
<div id="status">အသင့်ဖြစ်ပါပြီ</div>
<audio id="player" controls></audio>
<br>
<button id="download" disabled>အသံဖိုင်သိမ်းမယ်</button>
</div>

<div class="panel">
<h2>🤖 AI တီးလုံးဖန်တီးခြင်း</h2>
<p>သင့်အသံကို အခြေခံပြီး လိုက်ဖက်တဲ့ တီးလုံးကို AI ဖြင့် ရွေးချယ်ဖန်တီးရန်</p>
<button id="ai" disabled>AI တီးလုံးဖန်တီးမယ်</button>
<p class="small">AI Server မချိတ်ဆက်ရသေးပါ။ နောက်တစ်ဆင့်တွင် ချိတ်ဆက်ပါမည်။</p>
</div>

<script>
let recorder, chunks=[], audioBlob=null;
const recordBtn=document.getElementById("record");
const stopBtn=document.getElementById("stop");
const player=document.getElementById("player");
const statusText=document.getElementById("status");
const downloadBtn=document.getElementById("download");
const aiBtn=document.getElementById("ai");

recordBtn.onclick=async()=>{
 try{
  const stream=await navigator.mediaDevices.getUserMedia({audio:true});
  chunks=[];
  recorder=new MediaRecorder(stream);
  recorder.ondataavailable=e=>{if(e.data.size>0)chunks.push(e.data)};
  recorder.onstop=()=>{
   audioBlob=new Blob(chunks,{type:recorder.mimeType});
   player.src=URL.createObjectURL(audioBlob);
   downloadBtn.disabled=false;
   aiBtn.disabled=false;
   statusText.textContent="အသံသွင်းပြီးပါပြီ။ ပြန်နားထောင်နိုင်ပါပြီ။";
   stream.getTracks().forEach(t=>t.stop());
  };
  recorder.start();
  recordBtn.disabled=true;
  stopBtn.disabled=false;
  statusText.textContent="🔴 အသံသွင်းနေပါပြီ...";
 }catch(err){
  statusText.textContent="Microphone ခွင့်ပြုချက်ပေးပါ။";
 }
};

stopBtn.onclick=()=>{
 if(recorder && recorder.state==="recording"){
  recorder.stop();
  recordBtn.disabled=false;
  stopBtn.disabled=true;
 }
};

downloadBtn.onclick=()=>{
 if(!audioBlob)return;
 const a=document.createElement("a");
 a.href=URL.createObjectURL(audioBlob);
 a.download="my-song.webm";
 a.click();
};

aiBtn.onclick=()=>{
 alert("AI Server မချိတ်ဆက်ရသေးပါ။ နောက်တစ်ဆင့်တွင် AI တီးလုံးဖန်တီးစနစ် ချိတ်ဆက်ပါမည်။");
};
</script>
</body>
</html>
